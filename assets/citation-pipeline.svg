<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 300" width="100%" role="img" aria-label="Datenfluss: Benchmark, Evaluator, API und Redis-Queue, Docker-Worker mit Browser-use, lokales LLM, Auswertung gegen Ground Truth">
  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .box { fill: #FFFFFF; stroke: #E2E6E9; stroke-width: 1.5; }
    .eval { fill: #F8F9FA; stroke: #5C6971; stroke-width: 1.5; }
    .badge { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; fill: #E2001A; }
    .t { font-size: 18px; font-weight: 700; fill: #22252A; }
    .s { font-size: 14px; fill: #5C6971; }
    .flow { stroke: #5C6971; stroke-width: 1.6; fill: none; }
    .note { font-size: 13px; font-weight: 600; fill: #E2001A; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1 L9 5 L0 9 z" fill="#5C6971"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect class="box" x="10" y="20" width="190" height="104" rx="6"/>
  <text class="badge" x="26" y="46">DATEN</text>
  <text class="t" x="26" y="72">CiteAudit</text>
  <text class="s" x="26" y="94">citation · GT</text>
  <text class="s" x="26" y="112">source_type</text>

  <rect class="eval" x="245" y="20" width="190" height="104" rx="6"/>
  <text class="badge" x="261" y="46">EVALUATOR</text>
  <text class="t" x="261" y="72">Läufe steuern</text>
  <text class="s" x="261" y="94">hält GT zurück,</text>
  <text class="s" x="261" y="112">sendet nur citation</text>

  <rect class="box" x="480" y="20" width="190" height="104" rx="6"/>
  <text class="badge" x="496" y="46">API</text>
  <text class="t" x="496" y="72">Redis-Queue</text>
  <text class="s" x="496" y="94">verteilt Prüfaufträge</text>
  <text class="s" x="496" y="112">an die Worker</text>

  <rect class="box" x="715" y="20" width="190" height="104" rx="6"/>
  <text class="badge" x="731" y="46">DOCKER-WORKER</text>
  <text class="t" x="731" y="72">Browser-use</text>
  <text class="s" x="731" y="94">Playwright sucht</text>
  <text class="s" x="731" y="112">Belege im Web</text>

  <rect class="box" x="950" y="20" width="180" height="104" rx="6"/>
  <text class="badge" x="966" y="46">DHBW-GPU</text>
  <text class="t" x="966" y="72">Lokales LLM</text>
  <text class="s" x="966" y="94">bewertet Treffer:</text>
  <text class="s" x="966" y="112">Status 1–4</text>

  <path class="flow" d="M200 72 H243" marker-end="url(#a)"/>
  <path class="flow" d="M435 72 H478" marker-end="url(#a)"/>
  <path class="flow" d="M670 72 H713" marker-end="url(#a)"/>
  <path class="flow" d="M905 72 H948" marker-end="url(#a)"/>

  <!-- GT boundary -->
  <line x1="457" y1="8" x2="457" y2="138" stroke="#E2001A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="note" x="465" y="152">GT verlässt den Evaluator nie</text>

  <!-- Row 2: evaluation -->
  <rect class="eval" x="245" y="190" width="660" height="88" rx="6"/>
  <text class="badge" x="265" y="216">AUSWERTUNG</text>
  <text class="t" x="265" y="242">Status 1/2 → Real, 3/4 → Fake · Vergleich mit GT</text>
  <text class="s" x="265" y="264">Accuracy · Precision · Recall · F1 je source_type, Laufzeit, Fehlfälle</text>

  <path class="flow" d="M340 124 V188" marker-end="url(#a)"/>
  <path class="flow" d="M1040 124 V234 H907" marker-end="url(#a)"/>
  <text class="s" x="925" y="226">Antwort</text>
</svg>
