<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="100%" role="img" aria-label="Durchsatz nach Anzahl Worker: 1 Worker 86 Quellen pro Stunde, 2: 132, 4: 213, 8: 330 (3,9-fach), 12: 389">
  <style>
    text { font-family: "Inter", -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
    .h { font-size: 15px; font-weight: 600; fill: #3F474C; }
    .ax { font-size: 15px; font-weight: 600; fill: #3F474C; }
    .sub { font-size: 13px; fill: #5C6971; }
    .v { font-size: 15px; font-weight: 700; fill: #22252A; }
    .vr { font-size: 15px; font-weight: 700; fill: #E2001A; }
  </style>

  <text class="h" x="0" y="20">Quellen pro Stunde nach Anzahl Worker</text>

  <!-- baseline y=270, 0.5 px per source/h -->
  <line x1="20" y1="270" x2="590" y2="270" stroke="#9AA5AC" stroke-width="1"/>

  <rect x="50" y="227" width="64" height="43" rx="4" fill="#C6CDD2"/>
  <text class="v" x="82" y="200" text-anchor="middle">86</text>
  <text class="sub" x="82" y="218" text-anchor="middle">1,0×</text>

  <rect x="160" y="204" width="64" height="66" rx="4" fill="#C6CDD2"/>
  <text class="v" x="192" y="177" text-anchor="middle">132</text>
  <text class="sub" x="192" y="195" text-anchor="middle">1,5×</text>

  <rect x="270" y="163" width="64" height="107" rx="4" fill="#C6CDD2"/>
  <text class="v" x="302" y="136" text-anchor="middle">213</text>
  <text class="sub" x="302" y="154" text-anchor="middle">2,5×</text>

  <rect x="380" y="105" width="64" height="165" rx="4" fill="#E2001A"/>
  <text class="vr" x="412" y="78" text-anchor="middle">330</text>
  <text class="sub" x="412" y="96" text-anchor="middle">3,9×</text>

  <rect x="490" y="75" width="64" height="195" rx="4" fill="#C6CDD2"/>
  <text class="v" x="522" y="48" text-anchor="middle">389</text>
  <text class="sub" x="522" y="66" text-anchor="middle">4,6×</text>

  <text class="ax" x="82" y="292" text-anchor="middle">1</text>
  <text class="ax" x="192" y="292" text-anchor="middle">2</text>
  <text class="ax" x="302" y="292" text-anchor="middle">4</text>
  <text class="ax" x="412" y="292" text-anchor="middle" fill="#E2001A">8</text>
  <text class="ax" x="522" y="292" text-anchor="middle">12</text>
  <text class="sub" x="522" y="312" text-anchor="middle">Warteschlange</text>
  <text class="sub" x="302" y="322" text-anchor="middle">Worker</text>
</svg>
