<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 270" width="100%" height="auto" role="img" aria-labelledby="title description">
  <title id="title">Vergleich der Confusion Matrices von Run 1 und Run 2</title>
  <desc id="description">Beide Läufe umfassen 9.354 Fälle. Run 2 hat 126 weniger Fehlalarme und 12 weniger übersehene Fakes als Run 1.</desc>
  <defs>
    <style>
      .title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1B1E22; }
      .subtitle { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5C6971; }
      .axis { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5C6971; }
      .row { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1B1E22; }
      .count { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1B1E22; }
      .cell-label { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5C6971; }
      .error-label { font: 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #B60016; }
      .accuracy { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1B1E22; }
      .cell { fill: #F3F4F6; stroke: #E2E6E9; }
      .error { fill: #FDF0F1; stroke: #F0C9CE; }
      .divider { stroke: #E2E6E9; }
    </style>
  </defs>

  <line class="divider" x1="460" y1="12" x2="460" y2="260" />

  <g transform="translate(10 0)">
    <text class="title" x="0" y="24">Run 1 · db5213ce</text>
    <text class="subtitle" x="0" y="43">Referenz: Real 6.417 · Fake 2.937</text>
    <text class="axis" x="190" y="70" text-anchor="middle">Vorhersage Real</text>
    <text class="axis" x="340" y="70" text-anchor="middle">Vorhersage Fake</text>
    <text class="row" x="0" y="119">Real</text>
    <text class="subtitle" x="0" y="136">Referenz</text>
    <text class="row" x="0" y="189">Fake</text>
    <text class="subtitle" x="0" y="206">Referenz</text>
    <rect class="cell" x="120" y="82" width="140" height="62" rx="6" />
    <text class="count" x="190" y="108" text-anchor="middle">5.386</text>
    <text class="cell-label" x="190" y="129" text-anchor="middle">TN · 83,9 %</text>
    <rect class="error" x="270" y="82" width="140" height="62" rx="6" />
    <text class="count" x="340" y="108" text-anchor="middle">1.031</text>
    <text class="error-label" x="340" y="129" text-anchor="middle">FP · 16,1 %</text>
    <rect class="error" x="120" y="152" width="140" height="62" rx="6" />
    <text class="count" x="190" y="178" text-anchor="middle">152</text>
    <text class="error-label" x="190" y="199" text-anchor="middle">FN · 5,2 %</text>
    <rect class="cell" x="270" y="152" width="140" height="62" rx="6" />
    <text class="count" x="340" y="178" text-anchor="middle">2.785</text>
    <text class="cell-label" x="340" y="199" text-anchor="middle">TP · 94,8 %</text>
    <text class="accuracy" x="120" y="245">Accuracy 87,4 %</text>
  </g>

  <g transform="translate(480 0)">
    <text class="title" x="0" y="24">Run 2 · fb3ebb05 · v7.2</text>
    <text class="subtitle" x="0" y="43">Referenz: Real 6.417 · Fake 2.937</text>
    <text class="axis" x="190" y="70" text-anchor="middle">Vorhersage Real</text>
    <text class="axis" x="340" y="70" text-anchor="middle">Vorhersage Fake</text>
    <text class="row" x="0" y="119">Real</text>
    <text class="subtitle" x="0" y="136">Referenz</text>
    <text class="row" x="0" y="189">Fake</text>
    <text class="subtitle" x="0" y="206">Referenz</text>
    <rect class="cell" x="120" y="82" width="140" height="62" rx="6" />
    <text class="count" x="190" y="108" text-anchor="middle">5.512</text>
    <text class="cell-label" x="190" y="129" text-anchor="middle">TN · 85,9 %</text>
    <rect class="error" x="270" y="82" width="140" height="62" rx="6" />
    <text class="count" x="340" y="108" text-anchor="middle">905</text>
    <text class="error-label" x="340" y="129" text-anchor="middle">FP · 14,1 %</text>
    <rect class="error" x="120" y="152" width="140" height="62" rx="6" />
    <text class="count" x="190" y="178" text-anchor="middle">140</text>
    <text class="error-label" x="190" y="199" text-anchor="middle">FN · 4,8 %</text>
    <rect class="cell" x="270" y="152" width="140" height="62" rx="6" />
    <text class="count" x="340" y="178" text-anchor="middle">2.797</text>
    <text class="cell-label" x="340" y="199" text-anchor="middle">TP · 95,2 %</text>
    <text class="accuracy" x="120" y="245">Accuracy 88,8 %</text>
  </g>
</svg>
