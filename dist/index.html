<header>Citation Evaluation</header>
<h6 id="04--prompt-v72">04 · Prompt v7.2</h6>
<h1 id="lockerer-an-der-form-strenger-bei-der-autorenliste">Lockerer an der Form, strenger bei der Autorenliste</h1>
<div class="columns">
<div class="card" style="flex: 1;">
<h3 id="neu-in-v72">Neu in v7.2</h3>
<p>Titel, Autoren und Reihenfolge einer <strong>früheren Fassung</strong> sind kein Fehler</p>
<p><strong>Organisationen</strong> dürfen Autor von Webseiten, Datensätzen und Software sein</p>
<p><strong>DBLP und Semantic Scholar</strong> vor Status 4 prüfen</p>
</div>
<div class="card red" style="flex: 1;">
<h3 id="gegenma%C3%9Fnahme">Gegenmaßnahme</h3>
<p>Die <strong>vollständige Autorenliste</strong> muss abgeglichen werden: 5 Fälle mit Problem wurden akzeptiert, bei einem nannte das Modell nur den Erstautor</p>
<p class="note">Risiko: Behauptet das Modell eine frühere Fassung ohne Beleg, steigt die Falsch-negativ-Rate.</p>
</div>
</div>
<blockquote>
<p>Auf denselben 200 Zitaten ist v7.2 leicht besser als v7.1 (91,5 % gegenüber 90,0 %). Der Vollauf zeigt: 905 Fehlalarme bleiben.</p>
</blockquote>

<td style="text-align:left"><code>ca-01851</code></td>
<td style="text-align:left">Wu, Wang, Long, Autoformer, 2021</td>
<td style="text-align:left">Jiehui Xu fehlt in der Autorenliste</td>
</tr>

</div>
